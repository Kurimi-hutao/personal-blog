name: Deploy to CloudBase

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudbase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      COS_SDK_KEEPALIVE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CloudBase secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TCB_ENV_ID" || { echo "Missing GitHub Secret: TCB_ENV_ID"; exit 1; }
          test -n "$TCB_SECRET_ID" || { echo "Missing GitHub Secret: TCB_SECRET_ID"; exit 1; }
          test -n "$TCB_SECRET_KEY" || { echo "Missing GitHub Secret: TCB_SECRET_KEY"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install CloudBase CLI
        run: npm install -g @cloudbase/cli@3.8.5

      - name: Prepare static site
        id: package
        run: node scripts/prepare-cloudbase.mjs

      - name: Login to CloudBase
        shell: bash
        run: |
          tcb login \
            --apiKeyId "$TCB_SECRET_ID" \
            --apiKey "$TCB_SECRET_KEY"

      - name: Deploy to CloudBase static hosting
        shell: bash
        env:
          DEPLOY_ENTRIES: ${{ steps.package.outputs.entries }}
        run: |
          set -euo pipefail
          tcb hosting deploy _deploy \
            -e "$TCB_ENV_ID" \
            --concurrency 5 \
            --retry-count 3 \
            --retry-interval 2000 \
            --entry "$DEPLOY_ENTRIES" \
            --verify \
            --yes
