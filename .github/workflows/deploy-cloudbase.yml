name: Deploy to CloudBase

on:
  push:
    branches:
      - main
  schedule:
    - cron: '17 * * * *'
  repository_dispatch:
    types: [content-published]
  workflow_dispatch:

concurrency:
  group: cloudbase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      BAIDU_PUSH_TOKEN: ${{ secrets.BAIDU_PUSH_TOKEN }}
      PLAUSIBLE_SCRIPT_URL: ${{ vars.PLAUSIBLE_SCRIPT_URL }}
      COS_SDK_KEEPALIVE: "false"
      COS_UPLOAD_SERIAL: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CloudBase secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TCB_ENV_ID" || { echo "Missing GitHub Secret: TCB_ENV_ID"; exit 1; }
          test -n "$TCB_SECRET_ID" || { echo "Missing GitHub Secret: TCB_SECRET_ID"; exit 1; }
          test -n "$TCB_SECRET_KEY" || { echo "Missing GitHub Secret: TCB_SECRET_KEY"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install locked build dependencies
        run: npm ci --ignore-scripts

      - name: Check deployment ordering and verification
        run: node --test scripts/check-compress-deploy.mjs scripts/check-html-slots.mjs scripts/check-seo.mjs scripts/check-cloudbase-deploy.mjs

      - name: Validate existing comment service without migration
        run: node scripts/check-comment-service.cjs

      - name: Install CloudBase SDK
        run: npm install --prefix .cloudbase-tools --no-save --ignore-scripts @cloudbase/manager-node@5.9.0

      - name: Prepare static site
        run: node scripts/prepare-cloudbase.mjs

      - name: Deploy to CloudBase static hosting
        run: node scripts/deploy-cloudbase.mjs

      - name: Restore search submission receipts
        uses: actions/cache/restore@v4
        with:
          path: .seo-submit
          key: search-submit-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: search-submit-

      - name: Submit verified public URLs
        run: node scripts/submit-search.mjs

      - name: Save received URL hashes
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .seo-submit
          key: search-submit-${{ github.run_id }}-${{ github.run_attempt }}
