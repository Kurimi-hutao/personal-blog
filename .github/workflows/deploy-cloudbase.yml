name: Deploy to CloudBase

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cloudbase-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy static site
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TCB_ENV_ID: ${{ secrets.TCB_ENV_ID }}
      TCB_SECRET_ID: ${{ secrets.TCB_SECRET_ID }}
      TCB_SECRET_KEY: ${{ secrets.TCB_SECRET_KEY }}
      COS_SDK_KEEPALIVE: "false"
      COS_UPLOAD_SERIAL: "true"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate CloudBase secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "$TCB_ENV_ID" || { echo "Missing GitHub Secret: TCB_ENV_ID"; exit 1; }
          test -n "$TCB_SECRET_ID" || { echo "Missing GitHub Secret: TCB_SECRET_ID"; exit 1; }
          test -n "$TCB_SECRET_KEY" || { echo "Missing GitHub Secret: TCB_SECRET_KEY"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check deployment ordering and verification
        run: node --test scripts/check-cloudbase-deploy.mjs

      - name: Install CloudBase SDK
        run: npm install --prefix .cloudbase-tools --no-save --ignore-scripts @cloudbase/manager-node@5.9.0

      - name: Prepare static site
        run: node scripts/prepare-cloudbase.mjs

      - name: Deploy to CloudBase static hosting
        run: node scripts/deploy-cloudbase.mjs
