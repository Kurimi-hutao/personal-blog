name: Comment email notifications
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/check-comment-notifications.mjs'
      - 'scripts/check-resend-delivery.mjs'
      - '.github/workflows/comment-notifications.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/check-comment-notifications.mjs'
      - 'scripts/check-resend-delivery.mjs'
      - '.github/workflows/comment-notifications.yml'
permissions:
  contents: read
jobs:
  notifications:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/check-comment-notifications.mjs scripts/check-resend-delivery.mjs
